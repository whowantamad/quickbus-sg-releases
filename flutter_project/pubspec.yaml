name: quickbus_sg
description: "Minimalist Singapore Bus Arrival app powered by LTA DataMall v3 with Material 3 design and offline-first transit database."
publish_to: "none"
version: 1.0.8+9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sg_transit_snapshot.json
    - assets/mrt-map.png
